name: Build Dylib
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Theos & Toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y clang make git curl unzip libtinfo5 ldid
        export THEOS=$HOME/theos
        git clone --recursive https://github.com/theos/theos.git $THEOS
        git clone https://github.com/theos/sdks.git $THEOS/sdks
        git clone https://github.com/theos/toolchain.git $THEOS/toolchain
        echo "THEOS=$THEOS" >> $GITHUB_ENV
    - name: Build
      run: |
        export PATH=$THEOS/bin:$PATH
        make package FINALPACKAGE=1
    - name: Upload Dylib
      uses: actions/upload-artifact@v4
      with:
        name: Protection-Dylib
        path: .theos/obj/Protection.dylib
