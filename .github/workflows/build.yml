name: Build Dylib
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Theos
      run: |
        sudo apt-get update
        sudo apt-get install -y clang make git curl unzip
        git clone --recursive https://github.com/theos/theos.git $HOME/theos
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV
    - name: Download SDK
      run: |
        mkdir -p $HOME/theos/sdks
        curl -L -o sdk.zip https://github.com/theos/sdks/archive/master.zip
        unzip -q sdk.zip
        mv sdks-master/iPhoneOS14.5.sdk $HOME/theos/sdks/
    - name: Build
      run: |
        export PATH=$HOME/theos/bin:$PATH
        make package FINALPACKAGE=1
    - name: Upload Dylib
      uses: actions/upload-artifact@v4
      with:
        name: Protection-Dylib
        path: .theos/obj/Protection.dylib
